# ============================================================
# ACE-Compiler Wheel Build CI
#
# Builds wheels using pre-built dev images from Docker Hub and
# publishes them to PyPI.
#
# Build method is aligned with the internal `.aoneci/pipeline.yml`
# build-wheel job: WITH_ACELIB=OFF, SKBUILD_BUILD_VERBOSE=1,
# `pip wheel -v --no-deps --no-build-isolation`.
#
# Current settings:
#   - CPU wheels: disabled (build-cpu-wheels job commented out).
#   - CUDA wheels: only CUDA 12.8.0 (cu128); 13.0.0 / 13.1.0
#     commented out for later re-enablement.
#   - PyPI publish: only triggered by a push to the `publish/pypi`
#     branch. Other branches build wheels (artifact only) but do NOT
#     upload to PyPI.
#
# Usage:
#   - Push to master / publish branches: builds cu128 wheel (+ artifact)
#   - Push to `publish/pypi` branch: builds + publishes to PyPI
#   - Pull request: builds (primary combination) for verification
#   - Manual dispatch: select specific combination
# ============================================================

name: Build Wheels

on:
  push:
    branches:
      - master
      - 'release/*'
      - 'opensource/*'
      - 'publish/pypi'      # release branch: push triggers build + PyPI publish
      - 'ci/*'
      - 'test*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      wheel_type:
        description: 'Wheel type'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'cpu'
          - 'cuda'

env:
  DOCKER_IMAGE: opencc/dev

jobs:
  # Build CPU wheels — currently disabled (aligned with internal:
  # only a single CUDA wheel is published). Uncomment to re-enable.
  # build-cpu-wheels:
  #   name: Build Wheel (CPU Ubuntu ${{ matrix.ubuntu }})
  #   runs-on: ubuntu-22.04
  #   if: github.event.inputs.wheel_type == 'all' || github.event.inputs.wheel_type == 'cpu' || github.event_name != 'workflow_dispatch'
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       include:
  #         - { ubuntu: "22.04", torch: "2.5.1" }
  #         - { ubuntu: "24.04", torch: "2.11.0" }
  #
  #   steps:
  #     - uses: actions/checkout@v5
  #
  #     - name: Pull CPU image
  #       run: docker pull ${DOCKER_IMAGE}:ubuntu${{ matrix.ubuntu }}
  #
  #     - name: Build wheel
  #       run: |
  #         docker run --rm \
  #           -v ${{ github.workspace }}:/app \
  #           -v ${{ github.workspace }}/dist:/wheels \
  #           -e ACE_LOCAL_VERSION=cpu \
  #           -e WITH_ACELIB=OFF \
  #           -e SKBUILD_BUILD_VERBOSE=1 \
  #           ${DOCKER_IMAGE}:ubuntu${{ matrix.ubuntu }} \
  #           /bin/bash -c 'pip wheel -v --no-deps --no-build-isolation /app -w /wheels'
  #
  #     - name: Upload wheel artifact
  #       uses: actions/upload-artifact@v5
  #       with:
  #         name: wheel-cpu-ubuntu${{ matrix.ubuntu }}
  #         path: dist/*.whl
  #         retention-days: 30

  # Build CUDA wheels — only CUDA 12.8.0 (cu128) is enabled.
  # 13.0.0 / 13.1.0 are commented out for later re-enablement.
  build-cuda-wheels:
    name: Build Wheel (CUDA ${{ matrix.cuda }})
    runs-on: ubuntu-22.04
    if: github.event.inputs.wheel_type == 'all' || github.event.inputs.wheel_type == 'cuda' || github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda: "12.8.0", cuda_short: "128", ubuntu: "24.04", torch: "2.11.0" }
          # - { cuda: "13.0.0", cuda_short: "130", ubuntu: "24.04", torch: "2.11.0" }
          # - { cuda: "13.1.0", cuda_short: "131", ubuntu: "24.04", torch: "2.11.0" }

    steps:
      - uses: actions/checkout@v5

      - name: Pull CUDA image
        run: docker pull opencc/dev-cuda:${{ matrix.cuda }}-devel-ubuntu${{ matrix.ubuntu }}

      - name: Build wheel
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -v ${{ github.workspace }}/dist:/wheels \
            -e WITH_ACELIB=OFF \
            -e SKBUILD_BUILD_VERBOSE=1 \
            opencc/dev-cuda:${{ matrix.cuda }}-devel-ubuntu${{ matrix.ubuntu }} \
            /bin/bash -c 'pip wheel -v --no-deps --no-build-isolation /app -w /wheels'

      - name: Relabel wheel for PyPI (linux → manylinux)
        run: |
          sudo chmod -R 777 dist &&
          WHL=$(ls dist/*.whl) &&
          NEW_WHL=$(echo "$WHL" | sed 's/linux_x86_64/manylinux_2_39_x86_64/') &&
          echo "Original: $WHL" &&
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('$WHL', 'r') as zin:
              entries = {n: zin.read(n) for n in zin.namelist()}
          for name, data in entries.items():
              if name.endswith('/WHEEL') or name == 'WHEEL':
                  txt = data.decode().replace('Root-Is-Purelib: true', 'Root-Is-Purelib: false')
                  txt = txt.replace('linux_x86_64', 'manylinux_2_39_x86_64')
                  entries[name] = txt.encode()
          with zipfile.ZipFile('$NEW_WHL', 'w', zipfile.ZIP_DEFLATED) as zout:
              for name, data in entries.items():
                  zout.writestr(name, data)
          os.remove('$WHL')
          " &&
          echo "Relabeled: $(ls dist/*.whl)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheel-cuda-${{ matrix.cuda_short }}
          path: dist/*.whl
          retention-days: 30

  # Publish wheels to PyPI — only on a push to the `publish/pypi`
  # branch. Uses an API token (GitHub secret PYPI_API_TOKEN) with
  # twine's __token__ username convention. Other branches build
  # wheels as artifacts only and never upload to PyPI.
  publish-wheels:
    name: Publish Wheels to PyPI
    runs-on: ubuntu-22.04
    needs: [build-cuda-wheels]
    if: github.ref == 'refs/heads/publish/pypi'
    steps:
      - uses: actions/checkout@v5

      - name: Download wheel artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: |
          echo "Built wheels:"
          ls -la dist/*.whl

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload --verbose dist/*.whl