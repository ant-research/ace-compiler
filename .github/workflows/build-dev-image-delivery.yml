# ============================================================
# ACE-Compiler Dev Docker Image Build (CUDA)
#
# Builds and pushes CUDA dev Docker images to Docker Hub.
#
# Usage:
#   - Manual dispatch: build and push CUDA image
#   - Scheduled: rebuild images weekly
# ============================================================

name: Build Delivery Image (CUDA)

on:
  push:
    branches:
      - 'delivery/*'
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA version'
        required: false
        default: 'all'
        type: choice
        options:
          - '12.8.0'
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build-cuda-image:
    name: Build CUDA Image
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # CUDA 12.8 + torch 2.11.0 (cu128)
          - { cuda: "12.8.0", ubuntu: "24.04", torch: "2.11.0", torchvision: "0.26.0", torchaudio: "2.11.0", cu_version: "cu128", torch_index: "https://download.pytorch.org/whl/cu128", base: "nvidia/cuda:12.8.0-devel-ubuntu24.04" }

    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev.delivery
          push: true
          tags: opencc/ace:final-202610-v2
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            PIP_INDEX_URL=https://pypi.org/simple
            TORCH_VERSION=${{ matrix.torch }}
            TORCHVISION_VERSION=${{ matrix.torchvision }}
            TORCHAUDIO_VERSION=${{ matrix.torchaudio }}
            CU_VERSION=${{ matrix.cu_version }}
            TORCH_INDEX_URL=${{ matrix.torch_index }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
